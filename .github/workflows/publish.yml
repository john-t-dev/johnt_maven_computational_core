name: Publish to Maven Central
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7' 

      - name: Publish and Sign Payload
        run: |
          export ORG_GRADLE_PROJECT_signingKey=$(echo "${{ secrets.OSSRH_GPG_SECRET_KEY }}" | base64 -w 0)
          export ORG_GRADLE_PROJECT_signingPassword="${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}"
          export ORG_GRADLE_PROJECT_mavenCentralUsername="${{ secrets.OSSRH_USERNAME }}"
          export ORG_GRADLE_PROJECT_mavenCentralPassword="${{ secrets.OSSRH_PASSWORD }}"
          gradle publishAndReleaseToMavenCentral --no-configuration-cache
